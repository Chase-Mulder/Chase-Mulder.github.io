<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chase Mulder · Projects</title>
  <meta name="description" content="Projects and experiments by Chase Mulder.">
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --accent: #f5a524;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --border: #e3e3df;
        --text: #16181d;
        --muted: #5d6573;
        --accent: #c97a00;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 72px 24px 48px; }
    header { margin-bottom: 48px; }
    .eyebrow {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    h1 { font-size: clamp(32px, 6vw, 48px); margin: 8px 0 12px; letter-spacing: -0.02em; }
    header p { color: var(--muted); max-width: 560px; margin: 0; font-size: 17px; }
    .links { margin-top: 20px; display: flex; gap: 16px; }
    .links a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
    .links a:hover { border-color: var(--accent); }

    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      display: block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h3 { margin: 0 0 6px; font-size: 18px; }
    .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
    }
    .empty { border-style: dashed; color: var(--muted); }

    /* Featured project: full-width card with an animated preview */
    .card.featured {
      grid-column: 1 / -1;
      padding: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    }
    .card.featured:hover { border-color: var(--accent); }
    .featured .media {
      display: block;
      background: #f8f7f4;
      border-right: 1px solid var(--border);
      line-height: 0;
    }
    .featured .media { display: flex; align-items: center; }
    .featured .media img { width: 100%; height: auto; display: block; }
    .featured .body { padding: 24px; display: flex; flex-direction: column; }
    .featured .badge {
      align-self: flex-start;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
      padding: 2px 10px; margin-bottom: 12px;
    }
    .featured h3 { font-size: 22px; margin-bottom: 8px; }
    .featured h3 a { color: inherit; text-decoration: none; }
    .featured .stat-row { display: flex; gap: 20px; margin: 4px 0 16px; }
    .featured .stat b { display: block; font-size: 20px; color: var(--text); }
    .featured .stat span { font-size: 12px; color: var(--muted); }
    .featured .actions { display: flex; gap: 10px; margin-top: auto; padding-top: 18px; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 9px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
      text-decoration: none; border: 1px solid var(--border); color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
    .btn.primary:hover { filter: brightness(1.08); }
    @media (max-width: 760px) {
      .card.featured { grid-template-columns: 1fr; }
      .featured .media { border-right: 0; border-bottom: 1px solid var(--border); }
    }
    footer { margin-top: 64px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">chase-mulder.github.io</div>
      <h1>Chase Mulder</h1>
      <p>Software engineer working on warehouse automation. This is where I put side projects, tools and experiments.</p>
      <div class="links">
        <a href="https://github.com/Chase-Mulder">GitHub</a>
      </div>
    </header>

    <section>
      <h2>Projects</h2>
      <div class="grid" id="projects"></div>
    </section>

    <footer>© <span id="year"></span> Chase Mulder</footer>
  </main>

  <script>
    // To add a project: put its files in a folder (e.g. /my-project/index.html)
    // and add an entry below. "link" is the folder name followed by a slash.
    // Optional fields: featured (full-width card), image, source, stats [{ value, label }].
    const projects = [
      {
        title: "AGV Warehouse Simulator",
        description: "A fleet of autonomous robots picks orders in a simulated warehouse. Each robot plans its route with A*, follows right-of-way rules and re-plans around traffic. A built-in fleet-size sweep shows where congestion takes over: two-way aisles stall around 1,200 orders/hr, while one-way aisles scale past 2,000.",
        link: "warehouse-sim/",
        source: "https://github.com/Chase-Mulder/warehouse-sim",
        image: "assets/warehouse-sim.gif",
        featured: true,
        stats: [
          { value: "40", label: "robots max" },
          { value: "A*", label: "path planning" },
          { value: "~2,100/hr", label: "peak throughput" },
        ],
        tags: ["C#", ".NET 10", "Blazor WebAssembly", "Pathfinding", "Simulation"],
      },
      // { title: "My Project", description: "What it does in one line.", link: "my-project/", tags: ["JavaScript"] },
    ];

    function tagList(tags) {
      const wrap = document.createElement("div");
      wrap.className = "tags";
      for (const t of tags || []) {
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = t;
        wrap.appendChild(s);
      }
      return wrap;
    }

    function featuredCard(p) {
      const card = document.createElement("article");
      card.className = "card featured";
      card.innerHTML = `
        <a class="media"><img alt="" loading="lazy"></a>
        <div class="body">
          <span class="badge">Featured · Live demo</span>
          <h3><a></a></h3>
          <p></p>
          <div class="stat-row"></div>
          <div class="tag-slot"></div>
          <div class="actions">
            <a class="btn primary">Try it live →</a>
          </div>
        </div>`;
      card.querySelector(".media").href = p.link;
      const img = card.querySelector("img");
      img.src = p.image;
      img.alt = p.title + " running";
      const h = card.querySelector("h3 a");
      h.href = p.link;
      h.textContent = p.title;
      card.querySelector("p").textContent = p.description;
      const stats = card.querySelector(".stat-row");
      for (const st of p.stats || []) {
        const d = document.createElement("div");
        d.className = "stat";
        d.innerHTML = "<b></b><span></span>";
        d.querySelector("b").textContent = st.value;
        d.querySelector("span").textContent = st.label;
        stats.appendChild(d);
      }
      card.querySelector(".tag-slot").replaceWith(tagList(p.tags));
      card.querySelector(".btn.primary").href = p.link;
      if (p.source) {
        const src = document.createElement("a");
        src.className = "btn";
        src.href = p.source;
        src.textContent = "Source code";
        card.querySelector(".actions").appendChild(src);
      }
      return card;
    }

    const grid = document.getElementById("projects");
    if (projects.length === 0) {
      grid.innerHTML = '<div class="card empty"><h3>Coming soon</h3><p>The first project is on its way.</p></div>';
    } else {
      for (const p of projects) {
        if (p.featured) { grid.appendChild(featuredCard(p)); continue; }
        const a = document.createElement("a");
        a.className = "card";
        a.href = p.link;
        a.innerHTML = `<h3></h3><p></p><div class="tags"></div>`;
        a.querySelector("h3").textContent = p.title;
        a.querySelector("p").textContent = p.description;
        const tags = a.querySelector(".tags");
        for (const t of p.tags || []) {
          const s = document.createElement("span");
          s.className = "tag";
          s.textContent = t;
          tags.appendChild(s);
        }
        grid.appendChild(a);
      }
    }
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
